name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      REDIS_URL: https://ci.upstash.io
      REDIS_TOKEN: ci
      NEXTAUTH_SECRET: ci
      ANTHROPIC_API_KEY: ci
      ELEVENLABS_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # On PRs only build what changed; on pushes check everything.
      - name: Typecheck, lint, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo run typecheck lint test build --affected
          else
            npx turbo run typecheck lint test build
          fi

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      REDIS_URL: https://ci.upstash.io
      REDIS_TOKEN: ci
      NEXTAUTH_SECRET: ci
      ANTHROPIC_API_KEY: ci
      ELEVENLABS_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx turbo run build --filter=@isaii/web
      - run: npm run test:e2e -w @isaii/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }
